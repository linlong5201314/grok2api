name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run offline test suite
        # Live integration tests (tests/test_*_live.py) require a running
        # server + network and are excluded from CI.
        run: >
          uv run pytest tests
          --ignore=tests/test_tool_calls_live.py
          --ignore=tests/test_messages_tool_calls_live.py
          --ignore=tests/test_responses_tool_calls_live.py
          -q
